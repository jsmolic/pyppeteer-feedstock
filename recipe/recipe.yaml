schema_version: 1

context:
  version: 2.0.0
  build_number: '0'

package:
  name: pyppeteer
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pyppeteer/pyppeteer-${{ version }}.tar.gz
  sha256: 4af63473ff36a746a53347b2336a49efda669bcd781e400bc1799b81838358d9

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - pyppeteer-install = pyppeteer.command:install

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core
  run:
    - appdirs >=1.4.3,<2.0.0
    - certifi >=2023
    - importlib-metadata >=1.4
    - pyee >=11.0.0,<12.0.0
    - python >=${{ python_min }}
    - tqdm >=4.42.1,<5.0.0
    - urllib3 >=1.25.8,<2.0.0
    - websockets >=10.0,<11.0
tests:
  - python:
      imports:
        - pyppeteer
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - export PYPPETEER_HOME=$(pwd)/tmp || set PYPPETEER_HOME=%CD%\tmp
      - pyppeteer-install

about:
  summary: Headless chrome/chromium automation library (unofficial port of puppeteer)
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pyppeteer/pyppeteer
  repository: https://github.com/pyppeteer/pyppeteer
  documentation: https://pyppeteer.github.io/pyppeteer

extra:
  recipe-maintainers:
    - kiwi0fruit
    - bollwyvl
    - SylvainCorlay
